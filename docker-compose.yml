version: '3.7'

services:
  # 1. Base de Datos para las métricas de k6
  influxdb:
    image: influxdb:1.8  # Se recomienda 1.8 para k6 y el plugin antiguo de Grafana
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_USER=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    volumes:
      - influxdb_data:/var/lib/influxdb

  # 2. Servidor de Visualización
  grafana:
    image: grafana/grafana:9.5.18-ubuntu # Una versión estable
    ports:
      - "3000:3000"
    volumes:
      # Monta la configuración automática de data sources y dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb

  # 3. Contenedor para correr k6 (opcional, puedes correrlo localmente)
  k6:
    image: grafana/k6:latest
    volumes:
      - .:/app
    command:
      # Este comando arranca la prueba y exporta a InfluxDB
      - run
      - /app/k6-test.js
      - --out
      - influxdb=http://influxdb:8086/k6
    depends_on:
      - influxdb
    environment:
      - K6_INFLUXDB_USERNAME=k6
      - K6_INFLUXDB_PASSWORD=k6

volumes:
  influxdb_data: