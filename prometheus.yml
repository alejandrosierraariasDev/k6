global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'k6'
    # La máquina local ('host.docker.internal') o la red Docker
    static_configs:
      - targets: ['host.docker.internal:6565']
        # Nota: Si host.docker.internal falla en Linux, prueba '172.17.0.1:6565'
        # o averigua el gateway de tu red Docker.